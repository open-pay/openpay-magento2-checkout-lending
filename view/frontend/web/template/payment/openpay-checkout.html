 <style>
    /*
    * Selector correcto: Apunta al título dentro del contenedor del método de pago
    */
    .payment-method .payment-method-title {
        display: flex;
        align-items: center;
    }

    /*
    * Contenedor de los íconos para agregar espaciado
    */
    .payment-icons-container {
        margin-left: 15px; /* Ajusta este valor según el espacio que desees */
    }

    .payment-icon {
        width: 90px;   /* Ajusta el ancho que desees */
        height: 25px;  /* Ajusta el alto que desees */
        object-fit: contain; /* Asegura que la imagen se escale bien dentro del espacio */
    }
    
 </style>
<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <label data-bind="attr: {'for': getCode()}" class="label"><span data-bind="text: getTitle()"></span></label>

        <div class="payment-icons-container">
             <img class="payment-icon" src="https://img.openpay.mx/plugins/kueskipay_logo.svg"  alt="Buy Now, Pay Later" />
        </div>
    </div>
    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
                
        <div id="checkout-lending-container" class="items check payable">            
            <h3 style="border-bottom: 1px solid #cccccc; padding-bottom: 15px;">Compra ahora, paga despues.</h3>
            <img style="max-width: 40%;" data-bind="attr: { src: require.toUrl('Openpay_CheckoutLending/img/kueskipay.png') }" />
        </div>
          
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
                <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="
                        click: placeOrder,
                        attr: {title: $t('Place Order')},
                        css: {disabled: !isPlaceOrderActionAllowed()},
                        enable: (getCode() == isChecked())
                        "
                        disabled>
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
